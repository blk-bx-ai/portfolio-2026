name: Finalise About heading selector

on:
  push:
    branches:
      - seo/technical-foundations-2026-09-10
    paths:
      - scripts/fix_about_selector.py
      - .github/workflows/fix-about-selector.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/technical-foundations-2026-09-10
          fetch-depth: 0
      - run: python3 scripts/fix_about_selector.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html
          git diff --cached --check
          git commit -m "Fix About heading responsive selector"
          git push origin HEAD:seo/technical-foundations-2026-09-10
