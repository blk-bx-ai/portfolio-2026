name: Apply technical SEO changes

on:
  push:
    branches:
      - seo/technical-foundations-2026-09-10
    paths:
      - scripts/apply_seo_fixes.py
      - .github/workflows/apply-seo.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/technical-foundations-2026-09-10
          fetch-depth: 0

      - name: Apply and validate transformations
        run: python3 scripts/apply_seo_fixes.py

      - name: Commit transformed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about/index.html portfolio/index.html services/index.html contact/index.html
          git diff --cached --check
          git commit -m "Improve page metadata, accessibility and image loading"
          git push origin HEAD:seo/technical-foundations-2026-09-10
