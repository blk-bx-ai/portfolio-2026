<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Danny Maddock</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #2c2c2b;
      background: #f9f8f7;
    }
    main {
      width: min(720px, 100%);
      padding: 48px;
      background: #fff;
      border: 1px solid #e6e5e3;
      border-radius: 12px;
    }
    .label {
      margin: 0 0 16px;
      color: #7d7a75;
      font: 700 14px/1.4 Menlo, Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 4.5rem); line-height: 1; letter-spacing: -.05em; }
    h1 span { color: #8b5cf6; }
    p { max-width: 52ch; margin: 24px 0 32px; font-size: 18px; line-height: 1.6; color: #5f5d59; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; }
    a { color: #6d3de7; font-weight: 700; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #8b5cf6; outline-offset: 4px; }
    @media (max-width: 560px) { main { padding: 32px 24px; } }
    @media (prefers-color-scheme: dark) {
      body { color: #fff; background: #191919; }
      main { background: #202020; border-color: rgba(255,255,255,.2); }
      .label, p { color: rgba(255,255,255,.65); }
      a { color: #bf9cff; }
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Error 404</p>
    <h1>This page does not <span>exist.</span></h1>
    <p>The link may be old, or the page may have moved. Use one of the links below to get back to the useful parts.</p>
    <nav aria-label="Recovery links">
      <a href="/">Home</a>
      <a href="/services/">Services</a>
      <a href="/portfolio/">Case studies</a>
      <a href="/contact/">Contact</a>
    </nav>
  </main>
</body>
</html>
